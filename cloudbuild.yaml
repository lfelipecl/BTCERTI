steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/btcerti", "."]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/btcerti"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - btcerti
      - --image
      - gcr.io/$PROJECT_ID/btcerti
      - --region
      - us-central1
      - --platform
      - managed
      - --quiet

images:
  - "gcr.io/$PROJECT_ID/btcerti"
